<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Players – Ozark Invitational 2026</title>
  <meta name="description" content="Browse the full player roster for the Ozark Invitational 2026. Filter by team, search by name, and view individual player profiles." />

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="favicon.ico" />
  <meta name="theme-color" content="#244f3c">

  <script>window.players = window.players || [];</script>
  <script src="script.js?v=3" defer></script>

  <style>
    body { padding-top: 70px; background: #fcfaf6; }

    /* Page header */
    .players-page-head {
      background: linear-gradient(135deg, #163023 0%, #244f3c 100%);
      padding: 2.75rem 1.5rem 2.5rem; color: #fff;
      position: relative; overflow: hidden;
    }
    .players-page-head::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 50%, rgba(209,161,75,.1), transparent 55%);
    }
    .players-page-head-inner {
      max-width: 1100px; margin: 0 auto; position: relative; z-index: 1;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 1.25rem; flex-wrap: wrap;
    }
    .players-page-head h1 { margin: 0 0 .3rem; font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 900; }
    .players-page-head p  { margin: 0; opacity: .75; font-size: .9rem; }

    .head-actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .head-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .45rem 1rem; border-radius: 999px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
      color: #fff; font-size: .85rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: background .12s ease;
    }
    .head-btn:hover { background: rgba(255,255,255,.22); text-decoration: none; }
    .head-btn.primary { background: #d1a14b; border-color: transparent; color: #1a1407; }
    .head-btn.primary:hover { filter: brightness(1.05); }

    /* Toolbar */
    .toolbar-wrap {
      background: #fff; border-bottom: 1px solid #e5ddd0;
      padding: .875rem 1.5rem; position: sticky; top: 70px; z-index: 50;
    }
    .toolbar-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 200px; max-width: 340px;
      padding: .5rem .9rem; border: 1.5px solid #e5ddd0; border-radius: 999px;
      font: inherit; font-size: .875rem; background: #fcfaf6;
      transition: border-color .12s, box-shadow .12s;
    }
    .search-box:focus { outline: none; border-color: #244f3c; box-shadow: 0 0 0 3px rgba(36,79,60,.1); background: #fff; }

    .seg-group {
      display: flex; background: #fcfaf6;
      border: 1.5px solid #e5ddd0; border-radius: 999px; overflow: hidden;
    }
    .seg-btn {
      padding: .42rem .85rem; border: none; background: transparent;
      cursor: pointer; font-weight: 700; font-size: .8rem; color: #64748b;
      transition: background .1s, color .1s; white-space: nowrap;
    }
    .seg-btn[aria-pressed="true"] { background: #244f3c; color: #fff; border-radius: 999px; }

    .player-count { font-size: .82rem; color: #94a3b8; margin-left: auto; white-space: nowrap; }

    /* Grid */
    .players-body {
      max-width: 1100px; margin: 0 auto;
      padding: 1.75rem 1.5rem 4rem;
    }

    .pgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .pcard {
      background: #fff; border: 1px solid #e5ddd0;
      border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      display: flex; gap: 12px; align-items: center;
      padding: 1rem 1.1rem; cursor: pointer;
      text-decoration: none; color: inherit;
      transition: transform .12s ease, box-shadow .18s ease, border-color .15s ease;
    }
    .pcard:hover {
      transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,.09);
      border-color: rgba(36,79,60,.2); text-decoration: none;
    }

    .pcard-avatar {
      width: 60px; height: 60px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, #f3efe5, #e9e2cf);
      border: 1px solid #e5ddd0; display: grid; place-items: center;
      font-weight: 900; font-size: 1rem; color: #244f3c;
      overflow: hidden;
    }
    .pcard-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .pcard-body { flex: 1; min-width: 0; }
    .pcard-name { font-weight: 800; font-size: .97rem; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pcard-nick { font-size: .82rem; color: #64748b; margin-bottom: 5px; }
    .pcard-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .chip {
      border-radius: 999px; padding: .15rem .52rem;
      border: 1px solid #e5ddd0; background: #fcfaf6;
      font-size: .73rem; font-weight: 600;
    }
    .chip.oz { border-color: rgba(46,204,113,.4); color: #1f5c35; }
    .chip.va { border-color: rgba(52,152,219,.4); color: #8a672a; }

    .pcard-arrow {
      color: #c7c0b5; font-size: 1.1rem; flex-shrink: 0; margin-left: 4px;
    }

    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 3.5rem 1rem;
      color: #64748b;
    }
    .empty-state h3 { color: #1a1f2e; margin-bottom: .5rem; }

    /* Profile modal */
    dialog.profile-modal {
      border: 1px solid #e5ddd0; border-radius: 20px;
      max-width: 680px; width: clamp(320px, 92vw, 680px);
      padding: 0; box-shadow: 0 12px 48px rgba(0,0,0,.15);
      background: #fff;
    }
    dialog.profile-modal::backdrop { background: rgba(0,0,0,.42); }

    .pm-head {
      display: flex; gap: 14px; padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid #f0ebe0; align-items: center;
    }
    .pm-avatar {
      width: 76px; height: 76px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg,#f3efe5,#e9e2cf);
      border: 1px solid #e5ddd0; display: grid; place-items: center;
      font-weight: 900; font-size: 1.3rem; color: #244f3c; overflow: hidden;
    }
    .pm-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pm-title { font-weight: 900; font-size: 1.1rem; }
    .pm-sub   { color: #64748b; font-size: .9rem; margin-top: 2px; }
    .pm-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 6px; }

    .pm-body { padding: 1.1rem 1.25rem; display: grid; gap: 1rem; }
    .pm-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 500px) { .pm-row { grid-template-columns: 1fr; } }

    .stat-card {
      border: 1px solid #f0ebe0; border-radius: 12px;
      padding: .875rem 1rem; background: #fff;
    }
    .stat-card h4 {
      margin: 0 0 .5rem; font-size: .72rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .1em; color: #94a3b8;
    }
    .stat-card ul { margin: 0; padding-left: 1.1rem; }
    .stat-card li { font-size: .875rem; margin-bottom: .35rem; }
    .stat-card a { color: #244f3c; font-weight: 600; }

    .pm-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: .875rem 1.25rem; border-top: 1px solid #f0ebe0;
      background: rgba(252,250,246,.6); gap: .75rem;
    }
    .pm-close-btn {
      background: #fff; color: #244f3c; border: 1.5px solid #244f3c;
      border-radius: 999px; padding: .4rem 1.1rem; font-weight: 700;
      font-size: .875rem; cursor: pointer;
    }
    .pm-close-btn:hover { background: rgba(36,79,60,.05); }
    .pm-profile-btn {
      background: #244f3c; color: #fff; border: none;
      border-radius: 999px; padding: .4rem 1.1rem; font-weight: 700;
      font-size: .875rem; cursor: pointer; text-decoration: none;
      display: inline-block;
    }
    .pm-profile-btn:hover { background: #163023; text-decoration: none; }
  </style>
</head>
<body>
  <!-- Header -->
  <div id="siteHeader"></div>
  <script>
    fetch("header.html").then(r=>r.text()).then(h=>{
      document.getElementById("siteHeader").innerHTML = h;
      const here=(location.pathname.split('/').pop()||'players.html').toLowerCase();
      document.querySelectorAll('.nav a').forEach(a=>{
        const t=(a.getAttribute('href')||'').split('#')[0]||'index.html';
        if(t.toLowerCase()===here) a.setAttribute('aria-current','page');
      });
      if(window.initTeamScoreWidget) window.initTeamScoreWidget();
    });
  </script>

  <!-- PAGE HEADER -->
  <div class="players-page-head">
    <div class="players-page-head-inner">
      <div>
        <p style="font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;opacity:.65;margin-bottom:.35rem;font-weight:600;">Ozark Invitational 2026</p>
        <h1>Player Roster</h1>
        <p>Browse the field, filter by team, and view individual profiles.</p>
      </div>
      <div class="head-actions">
        <a href="register.html" class="head-btn primary">+ Register to Play</a>
        <a href="leaderboard.html" class="head-btn">Leaderboard</a>
      </div>
    </div>
  </div>

  <!-- STICKY TOOLBAR -->
  <div class="toolbar-wrap">
    <div class="toolbar-inner">
      <input id="searchInput" class="search-box" type="search" placeholder="Search name or nickname…" aria-label="Search players" />

      <div class="seg-group" role="group" aria-label="Filter by team">
        <button class="seg-btn" data-team="all"    aria-pressed="true">All</button>
        <button class="seg-btn" data-team="ozark"  aria-pressed="false">Ozark</button>
        <button class="seg-btn" data-team="valley" aria-pressed="false">Valley</button>
      </div>

      <div class="seg-group" role="group" aria-label="Sort players">
        <button class="seg-btn sort-btn" data-sort="name" aria-pressed="true">A→Z</button>
        <button class="seg-btn sort-btn" data-sort="hcp"  aria-pressed="false">Handicap</button>
      </div>

      <span class="player-count" id="playerCount" aria-live="polite"></span>
    </div>
  </div>

  <!-- GRID -->
  <div class="players-body">
    <div id="pgrid" class="pgrid"></div>
  </div>

  <!-- PROFILE MODAL -->
  <dialog id="profileModal" class="profile-modal" aria-label="Player profile">
    <div class="pm-head">
      <div class="pm-avatar" id="pmAvatar"></div>
      <div>
        <div id="pmName"  class="pm-title"></div>
        <div id="pmSub"   class="pm-sub"></div>
        <div id="pmChips" class="pm-chips"></div>
      </div>
    </div>
    <div class="pm-body">
      <div class="pm-row">
        <div class="stat-card">
          <h4>Contact</h4>
          <ul id="pmContact"></ul>
        </div>
        <div class="stat-card">
          <h4>Details</h4>
          <ul id="pmFacts"></ul>
        </div>
      </div>
      <div class="stat-card">
        <h4>Tournament Pairings</h4>
        <ul id="pmPlacements"></ul>
      </div>
    </div>
    <div class="pm-foot">
      <button class="pm-close-btn"  id="pmClose">Close</button>
      <a      class="pm-profile-btn" id="pmProfileLink" href="#" target="_blank">Full Profile →</a>
    </div>
  </dialog>

  <script>
    (function(){
      const SHARED_KEY  = "ozarkShared_v1";
      const SIGNUPS_KEY = "ozarkSignupsRoster_v1";
      const TEAM_LABELS = { ozark: "Team Ozark", valley: "Team Valley" };
      const PHOTO_BASE  = "images/players/";
      const PHOTO_EXTS  = ["png","jpg","jpeg","webp"];
      const AVATAR_CACHE = new Map();

      // --- Helpers ---
      function normStr(s){ return String(s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
      function displayName(p){
        const nick=(p.nickname||"").trim();
        return ((p.firstName||"")+(nick?` "${nick}" `:" ")+(p.lastName||"")).replace(/\s+/g," ").trim();
      }
      function initials(p){ return(((p.firstName||"").trim()[0]||"")+((p.lastName||"").trim()[0]||"")).toUpperCase()||"?"; }
      function teamOf(p){ const t=(p.team||"").toLowerCase(); return t.includes("val")?"valley":t.includes("oz")?"ozark":t; }
      function getHcp(p){ const v=p.handicap??p.Handicap??""; return v!==null&&v!==undefined&&String(v).trim()!==""?+v:null; }

      // --- Photo ---
      function candidateURLs(p){
        const ex=(p.photo||p.photourl||p.image||"").trim().replace(/\\/g,"/").replace(/^\/+/,"").replace(/^\.\//,"");
        if(ex){ if(/^https?:\/\//i.test(ex)) return[ex]; if(ex.includes("/")) return[ex]; return[PHOTO_BASE+ex]; }
        const s=normStr((p.firstName||"")+"-"+(p.lastName||"")); if(!s) return[];
        return PHOTO_EXTS.map(e=>`${PHOTO_BASE}${s}.${e}`);
      }
      function loadImg(url){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(url); i.onerror=rej; i.src=url; }); }
      async function resolvePhoto(p){
        if(!p||!p.id) return "";
        if(AVATAR_CACHE.has(p.id)) return AVATAR_CACHE.get(p.id);
        for(const url of candidateURLs(p)){ try{ await loadImg(url); AVATAR_CACHE.set(p.id,url); return url; }catch{} }
        AVATAR_CACHE.set(p.id,""); return "";
      }

      // --- Data loading ---
      let roster=[], snapshot=null;

      function loadData(){
        try{ const r=localStorage.getItem(SHARED_KEY); if(r) snapshot=JSON.parse(r); }catch{}
        if(snapshot&&Array.isArray(snapshot.players)&&snapshot.players.length){ roster=snapshot.players.slice(); return; }

        // Combine seeded players + approved signups
        const byId=new Map();
        if(Array.isArray(window.players)) window.players.forEach(p=>{ if(p&&p.id) byId.set(String(p.id),p); });
        if(window.state&&Array.isArray(window.state.players)) window.state.players.forEach(p=>{ if(p&&p.id) byId.set(String(p.id),p); });
        try{
          const r=localStorage.getItem(SIGNUPS_KEY); const a=r?JSON.parse(r):[];
          if(Array.isArray(a)) a.forEach(p=>{ if(p&&p.id) byId.set(String(p.id),p); });
        }catch{}
        roster=Array.from(byId.values());
      }

      // --- Placements ---
      function placementsFor(id){
        const out=[];
        try{
          if(!snapshot) return out;
          const g=snapshot?.groups||{}, fmt=snapshot?.format||{};
          ["day1","day2"].forEach(d=>["front","back"].forEach(s=>{
            const groups=g?.[d]?.[s]||[], f=fmt?.[d]?.[s]||"Best Ball";
            groups.forEach((arr,gi)=>{ if((arr||[]).some(x=>String(x)===String(id))) out.push(`${d==="day1"?"Day 1":"Day 2"} · ${s==="front"?"Front 9":"Back 9"} · ${f} — Group ${gi+1}`); });
          }));
        }catch{}
        return out;
      }

      // --- Filter / sort ---
      let filters={ team:"all", q:"", sort:"name" };

      function applyFilters(){
        const q=filters.q.toLowerCase();
        let arr=roster.filter(p=>{
          if(filters.team!=="all"&&teamOf(p)!==filters.team) return false;
          if(!q) return true;
          return displayName(p).toLowerCase().includes(q)||(p.email||"").toLowerCase().includes(q);
        });
        arr.sort(filters.sort==="hcp"
          ? (a,b)=>{ const ha=Number.isFinite(getHcp(a))?getHcp(a):9999; const hb=Number.isFinite(getHcp(b))?getHcp(b):9999; return ha-hb||displayName(a).localeCompare(displayName(b)); }
          : (a,b)=>displayName(a).localeCompare(displayName(b),undefined,{sensitivity:"base"})
        );
        return arr;
      }

      // --- Render ---
      function renderGrid(){
        const grid=document.getElementById("pgrid");
        const countEl=document.getElementById("playerCount");
        const rows=applyFilters();
        countEl.textContent=rows.length===1?"1 player":`${rows.length} players`;

        if(!rows.length){
          grid.innerHTML=`<div class="empty-state"><h3>No players found</h3><p>${filters.q?`No results for "${filters.q}".`:"No players in this team yet."}</p></div>`;
          return;
        }

        const byId=new Map(rows.map(p=>[String(p.id),p]));
        grid.innerHTML=rows.map(p=>{
          const team=teamOf(p);
          const tCls=team==="valley"?"va":"oz";
          const hcp=getHcp(p);
          const nick=(p.nickname||"").trim();
          const profileURL=`player.html?id=${encodeURIComponent(p.id)}`;
          return `
            <a class="pcard" href="${profileURL}" data-id="${p.id}" aria-label="View profile of ${displayName(p)}">
              <div class="pcard-avatar" data-photo-id="${p.id}">${initials(p)}</div>
              <div class="pcard-body">
                <div class="pcard-name">${displayName(p)}</div>
                ${nick?`<div class="pcard-nick">"${nick}"</div>`:""}
                <div class="pcard-chips">
                  <span class="chip ${tCls}">${TEAM_LABELS[team]||team}</span>
                  ${Number.isFinite(hcp)?`<span class="chip">HCP ${hcp}</span>`:""}
                </div>
              </div>
              <span class="pcard-arrow" aria-hidden="true">›</span>
            </a>`;
        }).join("");

        // Wire up modal on card click (but not if navigating to profile)
        grid.querySelectorAll(".pcard").forEach(card=>{
          card.addEventListener("click", e=>{
            // Only open modal if the click isn't on a child link
            if(e.defaultPrevented) return;
            e.preventDefault();
            const id=card.getAttribute("data-id");
            const p=byId.get(id);
            if(p) openModal(p);
          });
        });

        hydratePhotos(byId);
      }

      async function hydratePhotos(byId){
        for(const [id,p] of byId){
          const el=document.querySelector(`[data-photo-id="${id}"]`);
          if(!el) continue;
          const url=await resolvePhoto(p);
          if(url){ el.innerHTML=`<img src="${url}" alt="${displayName(p)}" loading="lazy" />`; }
        }
      }

      // --- Modal ---
      async function openModal(p){
        const modal    = document.getElementById("profileModal");
        const pmAvatar = document.getElementById("pmAvatar");
        const pmName   = document.getElementById("pmName");
        const pmSub    = document.getElementById("pmSub");
        const pmChips  = document.getElementById("pmChips");
        const pmContact= document.getElementById("pmContact");
        const pmFacts  = document.getElementById("pmFacts");
        const pmPlaces = document.getElementById("pmPlacements");
        const pmLink   = document.getElementById("pmProfileLink");

        const team=teamOf(p);
        const hcp=getHcp(p);
        const nick=(p.nickname||"").trim();
        const tCls=team==="valley"?"va":"oz";

        pmAvatar.textContent=initials(p);
        pmName.textContent=displayName(p);
        pmSub.textContent=nick?`"${nick}"`:"";
        pmChips.innerHTML=`
          <span class="chip ${tCls}">${TEAM_LABELS[team]||team}</span>
          ${Number.isFinite(hcp)?`<span class="chip">Handicap ${hcp}</span>`:""}`;

        pmContact.innerHTML=[
          p.email?`<li><a href="mailto:${p.email}">${p.email}</a></li>`:"",
          p.phone?`<li>${p.phone}</li>`:"",
        ].filter(Boolean).join("")||`<li style="color:#94a3b8">No contact on file.</li>`;

        pmFacts.innerHTML=`
          <li>Team: ${TEAM_LABELS[team]||team}</li>
          <li>Handicap: ${Number.isFinite(hcp)?hcp:"—"}</li>`;

        const places=placementsFor(p.id);
        pmPlaces.innerHTML=places.length
          ? places.map(x=>`<li>${x}</li>`).join("")
          : `<li style="color:#94a3b8">Not yet placed.</li>`;

        pmLink.href=`player.html?id=${encodeURIComponent(p.id)}`;

        // Photo
        pmAvatar.textContent=initials(p);
        const url=await resolvePhoto(p);
        if(url){ pmAvatar.innerHTML=`<img src="${url}" alt="${displayName(p)}" />`; }

        modal.showModal();
      }

      document.getElementById("pmClose").addEventListener("click",()=> document.getElementById("profileModal").close());
      document.getElementById("profileModal").addEventListener("click",e=>{
        const r=document.getElementById("profileModal").getBoundingClientRect();
        if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) document.getElementById("profileModal").close();
      });

      // --- Toolbar events ---
      document.getElementById("searchInput").addEventListener("input",e=>{ filters.q=e.target.value; renderGrid(); });

      document.querySelectorAll("[data-team]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          document.querySelectorAll("[data-team]").forEach(b=>b.setAttribute("aria-pressed","false"));
          btn.setAttribute("aria-pressed","true");
          filters.team=btn.dataset.team;
          renderGrid();
        });
      });

      document.querySelectorAll(".sort-btn").forEach(btn=>{
        btn.addEventListener("click",()=>{
          document.querySelectorAll(".sort-btn").forEach(b=>b.setAttribute("aria-pressed","false"));
          btn.setAttribute("aria-pressed","true");
          filters.sort=btn.dataset.sort;
          renderGrid();
        });
      });

      // --- Boot ---
      function boot(){ loadData(); renderGrid(); }

      if(document.readyState==="loading"){
        document.addEventListener("DOMContentLoaded",()=>setTimeout(boot,80));
      } else {
        setTimeout(boot,80);
      }

      // Live-update when shared state changes
      window.addEventListener("storage",e=>{
        if(e.key===SHARED_KEY||e.key===SIGNUPS_KEY){ try{ if(e.key===SHARED_KEY&&e.newValue) snapshot=JSON.parse(e.newValue); }catch{} loadData(); renderGrid(); }
      });
    })();
  </script>
</body>
</html>
